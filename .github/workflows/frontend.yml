
name: Frontend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installation Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: |
          cd frontend
          npm ci

      - name: Lancer les tests
        run: |
          cd frontend
          npm test -- --run

      - name: Vérifier le build
        run: |
          cd frontend
          npm run build
